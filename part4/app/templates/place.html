<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <a href="index.html"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="hbnb Logo" class="logo"></a>
        <nav id="auth-link">
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main class="place-details" id="place-details">
        <h1 id="place-title">Loading...</h1>
        
        <div class="place-info">
            <p><strong>Host:</strong> <span id="place-host"></span></p>
            <p><strong>Price:</strong> <span id="place-price"></span></p>
            <p><strong>Description:</strong> <span id="place-desc"></span></p>
            <p><strong>Amenities:</strong> <span id="place-amenities"></span></p>
        </div>

        <section>
            <h2>Reviews</h2>
            <div id="reviews-container">
            </div>
            
            <div id="add-review-section" style="margin-top: 20px;">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 hbnb All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
