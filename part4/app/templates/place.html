<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <a href="/"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="hbnb Logo" class="logo"></a>
        <nav id="auth-nav">
            <a href="/login" id="login-link" class="login-button" style="display: none;">Login</a>
        </nav>
    </header>

    <main class="premium-place-details" id="place-details">
        <div class="place-header">
            <h1 id="place-title">Loading...</h1>
            <div class="place-meta">
                <span><i class="fa-solid fa-star"></i> Top rated</span>
                <span><i class="fa-solid fa-medal"></i> Superhost</span>
            </div>
        </div>
        
        <div class="place-content">
            <div class="place-info-card">
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-circle-user"></i></div>
                    <div class="info-text">
                        <strong>Hosted by</strong>
                        <span id="place-host"></span>
                    </div>
                </div>
                
                <div class="info-divider"></div>

                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-tag"></i></div>
                    <div class="info-text">
                        <strong>Price</strong>
                        <span id="place-price"></span>
                    </div>
                </div>
                
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-align-left"></i></div>
                    <div class="info-text">
                        <strong>Description</strong>
                        <span id="place-desc"></span>
                    </div>
                </div>
                
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-wifi"></i></div>
                    <div class="info-text">
                        <strong>Amenities</strong>
                        <span id="place-amenities"></span>
                    </div>
                </div>
            </div>

            <section class="reviews-section">
                <div class="reviews-header">
                    <h2><i class="fa-solid fa-star"></i> Guest Reviews</h2>
                </div>
                
                <div id="reviews-container" class="reviews-grid">
                </div>
                
                <div id="add-review-section" class="add-review-wrapper">
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 hbnb All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
