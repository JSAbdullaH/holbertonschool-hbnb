<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <a href="/"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="hbnb Logo" class="logo"></a>
        <nav id="auth-nav">
            <a href="/login" id="login-link" class="login-button" style="display: none;">Login</a>
        </nav>
    </header>

    <main class="add-review-page">
        <form id="add-review-form" class="form premium-form">
            <div class="form-header">
                <i class="fa-solid fa-star has-sparkles"></i>
                <h2>Add your review</h2>
                <p>Share your experience to help others</p>
            </div>
            
            <div class="form-group input-with-icon">
                <label for="rating">Rating</label>
                <div class="select-wrapper">
                    <i class="fa-solid fa-star-half-stroke icon"></i>
                    <select id="rating" name="rating" required>
                        <option value="5" selected>5 - Excellent (Highly Recommend)</option>
                        <option value="4">4 - Good (Very Nice)</option>
                        <option value="3">3 - Okay (Average)</option>
                        <option value="2">2 - Poor (Needs Improvement)</option>
                        <option value="1">1 - Terrible (Stay Away)</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group input-with-icon">
                <label for="comment">Comment</label>
                <div class="textarea-wrapper">
                    <i class="fa-regular fa-comment-dots icon"></i>
                    <textarea id="comment" name="comment" rows="5" required placeholder="What did you love about this place?"></textarea>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">
                <span>Submit Review</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 hbnb All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
