<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - Airbnb Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Airbnb Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main class="add-review">
        <form action="#" method="POST" class="form">
            <h2>Add your review</h2>
            
            <div class="form-group">
                <label for="rating">Rating (1-5)</label>
                <select id="rating" name="rating" required>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Good</option>
                    <option value="3">3 - Okay</option>
                    <option value="2">2 - Poor</option>
                    <option value="1">1 - Terrible</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="comment">Comment</label>
                <textarea id="comment" name="comment" rows="5" required placeholder="Share your experience..."></textarea>
            </div>
            
            <button type="submit">Submit Review</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Airbnb Clone. All rights reserved.</p>
    </footer>
</body>
</html>
